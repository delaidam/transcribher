[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delaida-transcriber"
version = "0.1.0"
description = "Private Bosnian and English OGG transcription for desktop and phone browsers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Delaida" }]
dependencies = [
    "faster-whisper>=1.2,<2",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    # Dictation only, and only on Windows, which ships no equivalent of
    # pw-record. The one thing Windows does offer, MCI, records 8-bit audio.
    "sounddevice>=0.5,<1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
# The hosted LLM backend only. Left out of the default install so a normal
# setup stays lean and works with no network at all.
hosted = ["anthropic>=0.40"]

[project.scripts]
delaida-transcriber = "delaida_transcriber.cli:main"
delaida-transcriber-web = "delaida_transcriber.web:main"
delaida-transcriber-dictate = "delaida_transcriber.dictate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delaida_transcriber"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-per-file-ignores = {"src/delaida_transcriber/web.py" = ["E501"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "microphone: opens the real capture device; run it with -m microphone",
]
# The microphone test is opt-in because opening and closing the capture device
# is not free: repeated cycles of it preceded an Intel Smart Sound firmware
# timeout and a DRIVER_POWER_STATE_FAILURE bugcheck on the development machine.
# A routine test run should not be able to take the desktop down with it.
addopts = "-m 'not microphone'"
